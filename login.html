<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unify</title>
    <!-- Google Fonts Comfortaa -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <nav aria-label="Main Navigation">
            <h1><a href="index.html">Unify</a></h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="interactive-form">
            <h2>Welcome Back</h2>
            <form id="login-form">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>

                <button type="submit">Login</button>
            </form>
            <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                Don't have an account? <a href="signup.html" style="color: var(--primary-color); text-decoration: none;">Sign up here</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Unify Project. All rights reserved.</p>
    </footer>
</body>
</html>
